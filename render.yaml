services:
  - type: web
    name: tably
    runtime: node
    region: ohio
    plan: 0.5c-512mb
    buildCommand: npm ci --omit=dev
    preDeployCommand: npm run db:setup
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: tably-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: tably-db
    region: ohio
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
    databaseName: tably
    user: tably
